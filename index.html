<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMRISS GGSS School App</title>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #eef2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }
    .app-screen {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    .app-header {
      background: #1a73e8;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }
    .app-header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }
    .app-header p {
      font-size: 12px;
      margin: 5px 0 0 0;
      opacity: 0.9;
    }
    .app-body {
      padding: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      background-color: #f8f9fa;
      color: #1a73e8;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="app-header">
      <h1>SMRISS GGSS MALL ROAD</h1>
      <p>BATHINDA • Official School App</p>
    </div>
    
    <div class="app-body">
      <a href="https://sites.google.com/view/shaheedmajorraviindersinghsand/home" class="btn" target="_blank">🌐 Official Website</a>
      <a href="https://www.pseb.ac.in/books?catid=3" class="btn" target="_blank">📚 Syllabus</a>
      <a href="https://docs.google.com/spreadsheets/d/1abuFliE2_pCgSKHB_HUQEvHSAvRTfX33h5k9_onDiAA/edit?usp=sharing" class="btn" target="_blank">📅 Time Table</a>
      <a href="https://docs.google.com/document/d/1Xl2OLmhVYVTWOzIjISUMj6vMDlduUc0oNvg73fuJBfA/edit?tab=t.0" class="btn" target="_blank">💬 Message</a>
    </div>
  </div>

</body>
</html>
