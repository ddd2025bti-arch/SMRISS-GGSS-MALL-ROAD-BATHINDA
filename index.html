<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMRISS GGSS School App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    .header-banner {
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: white;
      padding: 20px 15px;
      text-align: center;
    }
    .header-banner h1 {
      font-size: 18px;
      margin: 0 0 5px 0;
    }
    .header-banner p {
      font-size: 12px;
      margin: 0;
      opacity: 0.9;
    }
    .stitch-link-bar {
      background: #e8f0fe;
      padding: 10px 15px;
      text-align: center;
      border-bottom: 1px solid #d2e3fc;
    }
    .stitch-btn {
      display: inline-block;
      background: #1a73e8;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 15px;
    }
    .btn-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .btn-card .icon {
      font-size: 24px;
      display: block;
      margin-bottom: 8px;
    }
    .btn-card .title {
      font-size: 14px;
      font-weight: 600;
      color: #1a73e8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header-banner">
      <h1>SHAHEED MAJOR R.S. SANDHU</h1>
      <p>Govt. Smart School • Mall Road, Bathinda</p>
    </div>

    <!-- GOOGLE STITCH DIRECT LINK -->
    <div class="stitch-link-bar">
      <a href="https://stitch.withgoogle.com/preview/17478538286794595047?node-id=335177f62cb64654a08262e6c84ec24e" target="_blank" class="stitch-btn">
        🎨 Open Google Stitch Wireframe
      </a>
    </div>

    <!-- MAIN APP BUTTONS -->
    <div class="grid-container">
      <a href="url?id=37" class="btn-card" target="_blank">
        <span class="icon">🌐</span>
        <span class="title">School Website</span>
      </a>

      <a href="url?id=38" class="btn-card" target="_blank">
        <span class="icon">📚</span>
        <span class="title">PSEB Syllabus</span>
      </a>

      <a href="url?id=39" class="btn-card" target="_blank">
        <span class="icon">📅</span>
        <span class="title">Time Table</span>
      </a>

      <a href="https://github.com/issues0" class="btn-card" target="_blank">
        <span class="icon">💬</span>
        <span class="title">Latest Notice</span>
      </a>
    </div>
  </div>

</body>
</html>
